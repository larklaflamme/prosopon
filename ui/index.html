<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prosopon</title>
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@2.0.0/lib/three-vrm.module.js"
    }
  }
  </script>
</head>
<body>
  <!-- Titlebar (frameless drag region) -->
  <header class="titlebar" data-tauri-drag-region>
    <span class="status-dot" id="status-dot"></span>
    <span class="title" data-tauri-drag-region>Prosopon</span>
    <div class="window-controls">
      <button id="btn-minimize" title="Minimize" aria-label="Minimize">&#x2212;</button>
      <button id="btn-close" title="Hide to tray" aria-label="Hide to tray">&#x2715;</button>
    </div>
  </header>

  <!-- Avatar stage: VRM face (canvas) over the robot fallback -->
  <main class="orb-stage">
    <canvas class="avatar-canvas" id="avatar-canvas"></canvas>
    <div class="orb" id="orb" data-state="disconnected">
      <svg class="robot" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- antenna -->
        <g class="antenna">
          <line class="antenna-stem" x1="100" y1="36" x2="100" y2="56" />
          <circle class="antenna-tip" cx="100" cy="28" r="7" />
        </g>
        <!-- head -->
        <rect class="head" x="38" y="54" width="124" height="104" rx="26" />
        <!-- face plate -->
        <rect class="face" x="50" y="66" width="100" height="80" rx="18" />
        <!-- eyes -->
        <g class="eyes">
          <circle class="eye eye-left" cx="78" cy="100" r="13" />
          <circle class="eye eye-right" cx="122" cy="100" r="13" />
          <circle class="pupil pupil-left" cx="78" cy="100" r="5" />
          <circle class="pupil pupil-right" cx="122" cy="100" r="5" />
        </g>
        <!-- mouth / speaker grille -->
        <g class="mouth">
          <rect class="mouth-bar" x="82" y="126" width="36" height="8" rx="4" />
        </g>
        <!-- body + chest light -->
        <rect class="body" x="70" y="158" width="60" height="34" rx="12" />
        <circle class="chest" cx="100" cy="175" r="9" />
      </svg>
    </div>
    <div class="state-label" id="state-label">disconnected</div>
  </main>

  <!-- Transcript (ephemeral — cleared on quit) -->
  <section class="transcript" id="transcript">
    <div class="empty-hint">Say &ldquo;Hey Skye&rdquo; to begin.</div>
  </section>

  <!-- Logs panel (hidden by default; toggle from the bottom bar) -->
  <section class="logs" id="logs" hidden>
    <div class="logs-header">
      <span class="logs-title">Logs</span>
      <button id="btn-clear-logs" class="logs-clear" title="Clear logs">Clear</button>
    </div>
    <div class="logs-body" id="logs-body"></div>
  </section>

  <!-- Bottom bar -->
  <footer class="bottombar">
    <button id="btn-connect" class="connect" title="Connect" aria-label="Connect">Connect</button>
    <button id="btn-mute" class="mute" title="Mute" aria-label="Mute">&#127908;</button>
    <button id="btn-logs" class="logs-toggle" title="Toggle logs" aria-label="Toggle logs">Logs</button>
    <span class="latency" id="latency">&mdash; ms</span>
  </footer>

  <script src="main.js"></script>
  <script type="module" src="avatar.js"></script>
</body>
</html>
