# Prosopon server configuration.
# Every key is optional — missing keys fall back to the defaults below.

tts:
  base_url: "http://localhost:21802"   # Kokoro (docker)
  model: "kokoro"                      # tts-1 | tts-1-hd | kokoro
  voice: "af_heart"                    # default; Lark's deliberate choice (not af_sky)

cognition:
  base_url: "http://localhost:11434"   # Ollama
  model: "qwen2.5:3b"                  # fast-but-dumb default (M0); swap to qwen3:30b for smart tier

webrtc:
  listen_port: 29434                   # the ICE port the client tunnels to
  stun_servers:                        # public STUN for ICE candidate gathering
    - "stun:stun.l.google.com:19302"   # Google's public STUN (default)

signaling:
  listen_port: 29435                   # the SDP offer/answer endpoint (Option B)
  auth_token: ""                       # shared secret; set non-empty before exposing to the internet
  tls:                                 # HTTPS for the signaling endpoint (recommended for direct connection)
    cert: "/etc/letsencrypt/live/ac1.ravennest.science/fullchain.pem"   # path to fullchain.pem; empty = plain HTTP (localhost dev)
    key:  "/etc/letsencrypt/live/ac1.ravennest.science/privkey.pem"     # path to privkey.pem; empty = plain HTTP (localhost dev)
