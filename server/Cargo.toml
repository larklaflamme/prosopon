[package]
name = "prosopon-server"
version = "0.1.0"
description = "Prosopon server — WebRTC voice loop: text in, cognition (Ollama) + TTS (Kokoro), audio out"
authors = ["Skye Laflamme <skye@ravennest.science>"]
edition = "2021"

[lib]
name = "prosopon_server"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
webrtc = "0.20.4"
async-trait = "0.1"
bytes = "1"
axum = "0.8"

[dev-dependencies]
serde_json = "1"

[features]
live-tests = []

[[test]]
name = "live_tts"
required-features = ["live-tests"]

[[test]]
name = "live_cognition"
required-features = ["live-tests"]

[[test]]
name = "live_pipeline"
required-features = ["live-tests"]
